services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:5179
      ASPNETCORE_ENVIRONMENT: Production
      TUITIONDESK_DATA_DIR: /data
    volumes:
      - tuitiondesk-data:/data
    expose:
      - "5179"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:5179/api/health"]
      interval: 5s
      timeout: 3s
      retries: 12

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  tuitiondesk-data:
